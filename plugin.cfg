[AUTHOR]
# NEVER CHANGE this information in future updates! LoxBerry uses it to identify
# the plugin and to handle updates. Changing it makes LoxBerry treat this as a
# different plugin and updates will fail.
NAME=Michael Schlenstedt
EMAIL=michael@loxberry.de

[PLUGIN]
# The version of this plugin.
VERSION=0.1.0

# Short name and preferred subfolder. If the name already exists on the
# installation system, LoxBerry appends 01, 02, ... - therefore no script may
# ever assume the literal folder name. NEVER CHANGE these two values.
NAME=debugmonitor
FOLDER=debugmonitor

# Friendly long name, 25 characters maximum.
TITLE=Debug Monitor
WEBSITE=https://wiki.loxberry.de/plugins/debugmonitor/start

[AUTOUPDATE]
AUTOMATIC_UPDATES=false

[SYSTEM]
# No reboot needed: the receiver is started by the plugin itself.
REBOOT=false

# LoxBerry Design System including the panel-less page used by the
# full-screen monitor (pagestart_nopanels.html) exists since 4.0.0.15.
LB_MINIMUM=4.0.0.15
LB_MAXIMUM=false

# Perl and Python only, no architecture-specific parts.
ARCHITECTURE=""

# The plugin log level drives the receiver log as well.
CUSTOM_LOGLEVELS=true

# Plugin Interface
INTERFACE=2.0
