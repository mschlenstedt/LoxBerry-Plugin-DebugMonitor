<div class="dmm" id="dmm">
	<div class="dmm-top">
		<span class="dmm-state" id="m-state"><span class="dm-dot"></span> …</span>
		<select class="dmm-ip" id="m-ip" title="<TMPL_VAR TERM.IP_HINT>"><option value=""><TMPL_VAR TERM.IP_ALL></option></select>
		<input class="dmm-filter" id="m-filter" type="search" autocomplete="off" spellcheck="false" placeholder="<TMPL_VAR TERM.FILTER>">
		<span class="dmm-types" id="m-types">
			<button type="button" data-type="" aria-pressed="true"><TMPL_VAR TERM.ALL></button>
			<button type="button" data-type="http" aria-pressed="false"><TMPL_VAR TERM.HTTP></button>
			<button type="button" data-type="tcp" aria-pressed="false"><TMPL_VAR TERM.TCP></button>
			<button type="button" data-type="udp" aria-pressed="false"><TMPL_VAR TERM.UDP></button>
			<button type="button" data-type="ssl" aria-pressed="false"><TMPL_VAR TERM.SSL></button>
			<button type="button" data-type="prg" aria-pressed="false"><TMPL_VAR TERM.PRG></button>
			<button type="button" data-type="lnk" aria-pressed="false" title="<TMPL_VAR TERM.LNK_HINT>"><TMPL_VAR TERM.LNK></button>
			<button type="button" data-type="err" aria-pressed="false"><TMPL_VAR TERM.ERR></button>
		</span>
		<button type="button" class="dmm-btn" id="m-bin" aria-pressed="false" title="<TMPL_VAR TERM.BIN_HINT>"><i class="pi pi-code"></i> <TMPL_VAR TERM.BIN></button>
		<button type="button" class="dmm-btn" id="m-pause"><i class="pi pi-pause"></i> <span><TMPL_VAR TERM.PAUSE></span></button>
		<button type="button" class="dmm-btn" id="m-clear"><i class="pi pi-trash"></i> <TMPL_VAR TERM.CLEAR></button>
		<label class="dmm-btn dmm-check"><input type="checkbox" id="m-wrap"> <TMPL_VAR TERM.WRAP></label>
		<span class="dmm-cnt" id="m-cnt"></span>
		<button type="button" class="dmm-btn dmm-close" id="m-close" title="<TMPL_VAR TERM.CLOSE>"><i class="pi pi-times"></i></button>
	</div>
	<div class="dmm-log" id="m-log" tabindex="0"></div>
	<button type="button" class="dmm-new" id="m-new" hidden></button>
</div>

<script>
(function () {
	'use strict';
	var T = <TMPL_VAR TERM_STRINGS>;
	var KEEP = 20000;      // lines kept for filtering
	var SHOW = 3000;       // lines in the DOM
	var POLL = 1000;

	var lines = [];        // {s, t, ip, m, c}
	var pos = '';
	var paused = false, unseen = 0, follow = true;
	var filter = '', type = '', showBin = false, ipSel = '';
	var ipEl = document.getElementById('m-ip'), ips = {};
	var logEl = document.getElementById('m-log');
	var stateEl = document.getElementById('m-state');
	var cntEl = document.getElementById('m-cnt');
	var newEl = document.getElementById('m-new');

	document.documentElement.classList.add('dmm-page');

	function fmt(s) { var a = arguments, i = 1; return String(s).replace(/%s/g, function () { return a[i++]; }); }
	function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

	// Colour group as in the Loxone Monitor: HTTP, TCP, UDP, DNS, SEQ_ERROR
	// (lines missing, found by the receiver), everything else.
	// Binary records (b = 1; older lines: k other than 1) are only shown on request.
	var RE_ERR = /\b(error|errors|failed|failure|fail|exception|refused|denied|timeout|timed out|invalid|unreachable|not found|too many requests)\b|HTTP\d*\s+[45]\d\d\b/i;
	var zebra = 0;
	function classify(l) {
		var bin = l.b !== undefined ? l.b === 1 : (l.k !== undefined && l.k !== null && l.k !== 1);
		if (bin) return 'bin';
		if (/^HTTP/.test(l.m)) return 'http';
		if (/^TCP/.test(l.m)) return 'tcp';
		if (/^UDP/.test(l.m)) return 'udp';
		if (/^DNS/.test(l.m)) return 'dns';
		if (/^SEQ_ERROR/.test(l.m)) return 'seq';
		return 'ms';
	}
	// Type buttons: the colour groups plus SSL, PRG and errors
	function ofType(l, t) {
		if (t === 'ssl') return /^SSL/.test(l.m);
		if (t === 'prg') return /^PRG/.test(l.m);
		// Loxone Link: everything from the Extensions carries LNK in the message
		if (t === 'lnk') return /\bLNK\b/.test(l.m);
		if (t === 'err') return l.c !== 'bin' && RE_ERR.test(l.m);
		return l.c === t;
	}
	// Miniserver selection like the IP box of the Loxone Monitor: filled with
	// every sender seen, sorted by address
	function noteIp(ip) {
		if (!ip || ips[ip]) return;
		ips[ip] = 1;
		var key = function (a) { return a.split('.').map(function (n) { return ('00' + n).slice(-3); }).join('.'); };
		var o = document.createElement('option');
		o.value = o.textContent = ip;
		var before = Array.prototype.find.call(ipEl.options, function (x) { return x.value && key(x.value) > key(ip); });
		ipEl.insertBefore(o, before || null);
	}
	function visible(l) {
		if (ipSel && l.ip !== ipSel) return false;
		if (l.c === 'bin' && !showBin) return false;
		if (type && !ofType(l, type)) return false;
		if (!filter) return true;
		return (l.t + ' ' + l.ip + ' ' + l.m).toLowerCase().indexOf(filter) >= 0;
	}
	function row(l) {
		return '<div class="ln c-' + l.c + (l.z ? ' z' : '') + '"><span class="t">' + esc(l.t || '            ') + '</span> <span class="ip">' + esc(l.ip) +
			'</span> ' + msg(l.m) + '</div>';
	}
	// The type at the start of a message (LNK, PRG, TCP, HTTP32, mDNS ...) gets a
	// column of its own, so the text right of it starts with some space
	var RE_TYPE = /^(mDNS|[A-Z][A-Z0-9_]{1,11})(\s+)([\s\S]*)$/;
	function msg(m) {
		var t = RE_TYPE.exec(m);
		// No type: empty column, so every message starts at the same place
		return t ? '<span class="ty">' + esc(t[1]) + '</span> ' + esc(t[3]) : '<span class="ty"></span> ' + esc(m);
	}
	function count() {
		cntEl.textContent = fmt(T.LINES, lines.length.toLocaleString());
	}
	function atBottom() { return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40; }

	function renderAll() {
		var out = [], n = 0;
		for (var i = lines.length - 1; i >= 0 && n < SHOW; i--) {
			if (visible(lines[i])) { out.push(row(lines[i])); n++; }
		}
		logEl.innerHTML = out.length ? out.reverse().join('') : '<div class="dmm-empty">' + esc(T.WAIT) + '</div>';
		logEl.scrollTop = logEl.scrollHeight;
		follow = true;
		unseen = 0;
		newEl.hidden = true;
		count();
	}
	function append(batch) {
		var html = '';
		batch.forEach(function (l) { if (visible(l)) html += row(l); });
		if (!html) return;
		var empty = logEl.querySelector('.dmm-empty');
		if (empty) empty.remove();
		var stick = follow && atBottom();
		logEl.insertAdjacentHTML('beforeend', html);
		while (logEl.childElementCount > SHOW) logEl.removeChild(logEl.firstElementChild);
		if (stick) logEl.scrollTop = logEl.scrollHeight;
	}

	function poll() {
		fetch('ajax.cgi?action=live&pos=' + encodeURIComponent(pos), { cache: 'no-store' })
			.then(function (r) { return r.json(); })
			.then(function (d) {
				if (!d.ok) throw new Error(d.error);
				pos = d.pos;
				var batch = [];
				(d.data || '').split('\n').forEach(function (s) {
					if (!s) return;
					try {
						var l = JSON.parse(s);
						l.c = classify(l);
						noteIp(l.ip);
						// Alternating shade per shown line, like the Loxone Monitor
						l.z = (zebra++ % 2) === 1;
						batch.push(l);
					} catch (e) { /* half line at a rotation - skip */ }
				});
				if (batch.length) {
					Array.prototype.push.apply(lines, batch);
					if (lines.length > KEEP) lines.splice(0, lines.length - KEEP);
					if (paused) {
						unseen += batch.filter(visible).length;
						newEl.textContent = fmt(T.NEW, unseen.toLocaleString());
						newEl.hidden = unseen === 0;
					} else {
						append(batch);
					}
					count();
				}
				setState(d.running);
				setTimeout(poll, d.more ? 50 : POLL);
			})
			.catch(function () {
				stateEl.innerHTML = '<span class="dm-dot bad"></span> ' + esc(T.LOST);
				setTimeout(poll, POLL * 3);
			});
	}

	var port = '', lastPacket = 0;
	function setState(running) {
		var cls = running ? (Date.now() / 1000 - lastPacket < 10 ? 'on' : 'idle') : 'off';
		var txt = !running ? T.STOPPED : fmt(cls === 'on' ? T.RUNNING : T.LISTENING, port);
		stateEl.innerHTML = '<span class="dm-dot ' + cls + '"></span> ' + esc(txt);
	}
	function status() {
		fetch('ajax.cgi?action=status', { cache: 'no-store' })
			.then(function (r) { return r.json(); })
			.then(function (d) {
				var st = d.receiver || {};
				port = st.port || '';
				lastPacket = st.last_packet || 0;
			})
			.catch(function () {})
			.then(function () { setTimeout(status, 5000); });
	}

	document.getElementById('m-filter').addEventListener('input', function (e) {
		filter = e.target.value.trim().toLowerCase();
		renderAll();
	});
	document.getElementById('m-types').addEventListener('click', function (e) {
		var b = e.target.closest('button');
		if (!b) return;
		type = b.dataset.type;
		this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
		renderAll();
	});
	document.getElementById('m-pause').addEventListener('click', function () {
		paused = !paused;
		this.querySelector('i').className = paused ? 'pi pi-play' : 'pi pi-pause';
		this.querySelector('span').textContent = paused ? T.RESUME : T.PAUSE;
		this.setAttribute('aria-pressed', paused ? 'true' : 'false');
		if (!paused) renderAll();
	});
	document.getElementById('m-bin').addEventListener('click', function () {
		showBin = !showBin;
		this.setAttribute('aria-pressed', showBin ? 'true' : 'false');
		renderAll();
	});
	newEl.addEventListener('click', function () { document.getElementById('m-pause').click(); });
	document.getElementById('m-clear').addEventListener('click', function () { lines = []; renderAll(); });
	ipEl.addEventListener('change', function () { ipSel = ipEl.value; renderAll(); });
	document.getElementById('m-wrap').addEventListener('change', function (e) {
		logEl.classList.toggle('wrap', e.target.checked);
	});
	document.getElementById('m-close').addEventListener('click', function () {
		window.close();
		// Not opened by a script (e.g. a bookmark): back to the plugin
		setTimeout(function () { location.href = 'index.cgi?form=monitor'; }, 150);
	});
	logEl.addEventListener('scroll', function () { follow = atBottom(); });

	renderAll();
	status();
	poll();
})();
</script>
