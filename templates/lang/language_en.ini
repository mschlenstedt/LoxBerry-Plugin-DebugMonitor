[AI]
TITLE="AI access (MCP)"
LEAD="Makes the recordings and the live messages queryable for AI assistants such as Claude Code – via the Model Context Protocol (MCP). The AI asks precisely (time range, Miniserver, message group, text) and gets only the result; the LoxBerry does the searching. Read-only."
SECT_SERVER="Server"
ON="Switch on the MCP server"
PORT="TCP port"
PORT_HELP="Port on which the MCP server is reachable in the own network (1024–65535). Endpoint: /mcp."
TOKEN="Access token"
TOKEN_NEW="New token"
TOKEN_HELP="Every request needs this token (Authorization: Bearer …). It is created when the server is switched on the first time. A new token makes the old one invalid at once."
SECT_CONNECT="Connect"
CC_HTTP="Claude Code – command in the terminal:"
CC_JSON="Other MCP clients or .mcp.json in a project:"
CC_SSH="Alternatively via SSH (no open port, no token) – same name, so add only one of the two:"
SSH_HELP="Needs an SSH login with key as user loxberry. The server then runs only for the session and does not depend on the switch above."
SECT_TOOLS="Tools for the AI"
T_STATUS="– receiver, Miniservers sending, period of the recordings"
T_LIST="– all recordings with period and size"
T_SEARCH="– lines by time range, Miniserver, message group (HTTP, TCP, LNK …), text or regex"
T_CONTEXT="– all lines around a point in time"
T_HTTP="– HTTP requests to the Miniserver with caller IP, port, user agent and error status (e.g. 401)"
T_SUMMARY="– overview: message groups, most frequent errors, swapped datagrams, HTTP callers"
T_TASKMON="– task monitor now: CPU, heap, temperature, counters and the threads, busiest first"
T_RESOURCES="– history of the figures from the CSV files (CPU, heap, temperature …)"
T_LIVE="– the newest lines from the running receiver"
EXAMPLE="Example question to the AI: “Who got a 401 from the Miniserver between 20:30 and 20:45, and why?”"
SAFETY_T="Own network only"
SAFETY="Do not forward the port in the router. Treat the token like a password: whoever has it can read all debug messages – they contain IP addresses, names of inputs and values, among others."

