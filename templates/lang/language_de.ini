[AI]
TITLE="KI-Zugang (MCP)"
LEAD="Macht die Aufzeichnungen und die laufenden Meldungen für KI-Assistenten wie Claude Code abfragbar – über das Model Context Protocol (MCP). Die KI fragt gezielt (Zeitraum, Miniserver, Meldungsart, Text) und bekommt nur das Ergebnis; das Durchsuchen erledigt der LoxBerry. Nur lesend."
SECT_SERVER="Server"
ON="MCP-Server einschalten"
PORT="TCP-Port"
PORT_HELP="Port, auf dem der MCP-Server im eigenen Netz erreichbar ist (1024–65535). Endpunkt: /mcp."
TOKEN="Zugriffsschlüssel"
TOKEN_NEW="Neuer Schlüssel"
TOKEN_HELP="Jede Anfrage braucht diesen Schlüssel (Authorization: Bearer …). Er wird beim ersten Einschalten erzeugt. Ein neuer Schlüssel macht den alten sofort ungültig."
SECT_CONNECT="Verbinden"
CC_HTTP="Claude Code – Befehl im Terminal:"
CC_JSON="Andere MCP-Clients bzw. .mcp.json im Projekt:"
CC_SSH="Alternativ über SSH (ohne offenen Port, ohne Schlüssel) – gleicher Name, also nur einen der beiden Wege eintragen:"
SSH_HELP="Setzt eine SSH-Anmeldung per Schlüssel als Benutzer loxberry voraus. Der Server läuft dann nur für die Dauer der Sitzung und ist unabhängig vom Schalter oben."
SECT_TOOLS="Werkzeuge für die KI"
T_STATUS="– Empfänger, sendende Miniserver, Zeitraum der Aufzeichnungen"
T_LIST="– alle Aufzeichnungen mit Zeitraum und Größe"
T_SEARCH="– Zeilen nach Zeitraum, Miniserver, Meldungsart (HTTP, TCP, LNK …), Text oder Regex"
T_CONTEXT="– alle Zeilen rund um einen Zeitpunkt"
T_HTTP="– HTTP-Anfragen an den Miniserver mit Absender-IP, Port, User-Agent und Fehlerstatus (z. B. 401)"
T_SUMMARY="– Überblick: Meldungsarten, häufigste Fehler, vertauschte Pakete, HTTP-Aufrufer"
T_TASKMON="– Aufgabenmonitor jetzt: CPU, Heap, Temperatur, Zähler und die Threads, die meiste CPU zuerst"
T_RESOURCES="– Verlauf der Kennzahlen aus den CSV-Dateien (CPU, Heap, Temperatur …)"
T_LIVE="– die neuesten Zeilen aus dem laufenden Empfang"
EXAMPLE="Beispielfrage an die KI: „Wer hat zwischen 20:30 und 20:45 vom Miniserver ein 401 bekommen, und warum?“"
SAFETY_T="Nur im eigenen Netz"
SAFETY="Den Port nicht im Router freigeben. Der Schlüssel ist wie ein Passwort zu behandeln: Wer ihn hat, kann alle Debug-Meldungen lesen – darin stehen u. a. IP-Adressen, Namen von Eingängen und Werte."

[LOGS]
TITLE="Logdateien"
LEAD="Alle Logdateien des Plugins: Empfänger (eine Sitzung je Start), Watchdog (nur wenn er eingreift) und Weboberfläche. Der Loglevel gilt für alle; der Empfänger übernimmt einen geänderten Loglevel beim nächsten Start."
NONE="Die Logliste konnte nicht geladen werden."

